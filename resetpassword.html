<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password – News Unpacker</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
      padding: 20px;
    }
    .reset-card {
      background: #ffffff;
      max-width: 420px;
      width: 100%;
      border-radius: 20px;
      padding: 36px 28px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
      border: 1px solid #e2e8f0;
      text-align: center;
    }
    .reset-card h2 {
      font-size: 1.5rem;
      color: #0f172a;
      margin-bottom: 8px;
    }
    .reset-card p {
      font-size: 0.88rem;
      color: #64748b;
      margin-bottom: 24px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.95rem;
      box-sizing: border-box;
      outline: none;
    }
    .reset-btn {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
    }
    .reset-btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="reset-card">
   <div class="brand-hero">
      <div class="logo-box">
        <svg class="site-logo" width="44" height="44" viewBox="0 0 48 48" fill="none">
          <rect width="48" height="48" rx="10" fill="#2563EB"/>
          <path d="M14 16H34V34C34 35.1 33.1 36 32 36H16C14.9 36 14 35.1 14 34V16Z" fill="#FFFFFF" fill-opacity="0.9"/>
          <path d="M20 22H28M20 26H26M20 30H24" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
          <path d="M30 26L34 22L38 26" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="brand-text">
          <span class="logo-text">News<span class="highlight">Unpacker</span></span>
          <span class="tagline">DECODE • VERIFY • BRIEF</span>
        </div>
      </div>
    </div>

    <h2>Set New Password</h2>
    <p>Enter your new password below for <strong id="userEmailDisplay">your account</strong>.</p>

    <form onsubmit="handlePasswordResetSubmit(event)">
      <div class="form-group">
        <label for="newPass">New Password</label>
        <input type="password" id="newPass" placeholder="At least 8 characters" required minlength="8">
      </div>

      <div class="form-group">
        <label for="confirmNewPass">Confirm New Password</label>
        <input type="password" id="confirmNewPass" placeholder="Re-enter identical password" required minlength="8">
      </div>

      <button type="submit" class="reset-btn" id="submitBtn">Update Password & Login</button>
    </form>
  </div>

  <script>
    // URL నుండి ఈమెయిల్ మరియు టోకెన్ తీసుకోవడం
    const urlParams = new URLSearchParams(window.location.search);
    const targetEmail = urlParams.get("email") || "";

    if (targetEmail) {
      document.getElementById("userEmailDisplay").innerText = targetEmail;
    }

    function handlePasswordResetSubmit(e) {
      e.preventDefault();
      const newPass = document.getElementById("newPass").value;
      const confirmNewPass = document.getElementById("confirmNewPass").value;

      if (newPass !== confirmNewPass) {
        alert("Passwords do not match. Please re-enter.");
        return;
      }

      // LocalStorage లో పాస్‌వర్డ్ అప్‌డేట్
      let users = JSON.parse(localStorage.getItem("news_unpacker_users")) || [];
      let idx = users.findIndex(u => u.email.toLowerCase() === targetEmail.toLowerCase());

      if (idx !== -1) {
        users[idx].password = newPass;
        localStorage.setItem("news_unpacker_users", JSON.stringify(users));
      }

      alert(" Password updated successfully! Please sign in with your new password.");
      window.location.href = "index.html?action=login";
    }
  </script>
</body>
</html>
